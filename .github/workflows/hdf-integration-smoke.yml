name: OpenHarmony HDF 6.1 LTS integration smoke test

on:
  workflow_dispatch:
  push:
    branches: [OpenHarmony]
    paths:
      - 'scripts/openharmony/**'
      - '.github/workflows/hdf-integration-smoke.yml'
      - 'drivers/Kconfig'
      - 'drivers/Makefile'
      - 'arch/arm64/kernel/vmlinux.lds.S'

permissions:
  contents: read

jobs:
  hdf-overlay:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout A32 kernel
        uses: actions/checkout@v4
        with:
          ref: OpenHarmony
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev python3 build-essential gcc-aarch64-linux-gnu clang lld device-tree-compiler

      - name: Fetch OpenHarmony 6.1 LTS HDF and dependencies
        run: |
          git clone --depth 1 --branch OpenHarmony-6.1-LTS https://github.com/openharmony/drivers_hdf_core.git ../drivers_hdf_core
          git clone --depth 1 --branch OpenHarmony-6.1-LTS https://github.com/openharmony/third_party_bounds_checking_function.git ../bounds_checking_function

      - name: Recreate the OpenHarmony source layout expected by KHDF
        run: |
          OHOS_ROOT="$(realpath "$PWD/../..")"
          mkdir -p "$OHOS_ROOT/drivers" "$OHOS_ROOT/third_party" "$OHOS_ROOT/vendor/samsung/a32"
          ln -sfn "$(realpath ../drivers_hdf_core)" "$OHOS_ROOT/drivers/hdf_core"
          ln -sfn "$(realpath ../bounds_checking_function)" "$OHOS_ROOT/third_party/bounds_checking_function"
          cp -a scripts/openharmony/test-product/hdf_config "$OHOS_ROOT/vendor/samsung/a32/"
          echo "OHOS_ROOT=$OHOS_ROOT" >> "$GITHUB_ENV"
          echo "PRODUCT_PATH=vendor/samsung/a32" >> "$GITHUB_ENV"
          test -f "$OHOS_ROOT/vendor/samsung/a32/hdf_config/khdf/hdf.hcs"
          test -f "$OHOS_ROOT/drivers/hdf_core/framework/tools/hc-gen/Makefile"

      - name: Prepare disposable HDF overlay
        run: |
          bash scripts/openharmony/prepare-hdf-overlay.sh ../drivers_hdf_core ../bounds_checking_function
          test -L drivers/hdf/khdf
          test -L drivers/hdf/framework
          test -L drivers/hdf/inner_api
          test -L include/hdf
          test -L bounds_checking_function
          grep -q 'obj-$(CONFIG_DRIVERS_HDF).*hdf/' drivers/Makefile
          grep -q '_hdf_drivers_start' arch/arm64/kernel/vmlinux.lds.S

      - name: Parse stock A32 defconfig with HDF available
        run: |
          make SHELL=/bin/bash CONFIG_SHELL=/bin/bash ARCH=arm64 a32_defconfig
          echo "Relevant generated config:"
          grep -E '^(CONFIG_DRIVERS_HDF=|# CONFIG_DRIVERS_HDF is not set|CONFIG_MEDIATEK_SOLUTION=|CONFIG_MTK_PLATFORM=)' .config || true
          ! grep -q '^CONFIG_DRIVERS_HDF=[ym]' .config
          grep -q '^CONFIG_MEDIATEK_SOLUTION=y' .config
          grep -q '^CONFIG_MTK_PLATFORM="mt6768"' .config
          echo "PASS: stock A32 config remains unchanged and HDF stays opt-in."

      - name: Build KHDF with isolated A32 test product config
        env:
          PRODUCT_PATH: vendor/samsung/a32
        run: |
          # This job validates KHDF source compatibility, not the A32 kernel's
          # production hardening profile. Keep stack-protector selection out of
          # this isolated smoke-test config so the host cross-toolchain's
          # compiler feature probe cannot block KHDF compilation.
          echo "Kernel compiler:"
          clang --version | head -n 1
          printf 'int smoke_test(void) { return 0; }\n' | clang --target=aarch64-linux-gnu -fstack-protector-strong -x c -c -o /tmp/a32-ssp-probe.o -
          scripts/config --enable DRIVERS_HDF --disable CC_STACKPROTECTOR_STRONG --disable CC_STACKPROTECTOR_REGULAR
          make SHELL=/bin/bash CONFIG_SHELL=/bin/bash ARCH=arm64 olddefconfig
          grep -q '^CONFIG_DRIVERS_HDF=y' .config
          ! grep -q '^CONFIG_CC_STACKPROTECTOR_\(STRONG\|REGULAR\)=y' .config
          HC_GEN_DIR="$OHOS_ROOT/drivers/hdf_core/framework/tools/hc-gen"
          make -C "$HC_GEN_DIR" BUILD_DIR="$HC_GEN_DIR/build/"
          "$HC_GEN_DIR/build/hc-gen" -b -i -a -o "$OHOS_ROOT/vendor/samsung/a32/hdf_config/khdf/hdf_hcs" "$OHOS_ROOT/vendor/samsung/a32/hdf_config/khdf/hdf.hcs"
          test -s "$OHOS_ROOT/vendor/samsung/a32/hdf_config/khdf/hdf_hcs_hex.c"
          make SHELL=/bin/bash CONFIG_SHELL=/bin/bash ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang CPP='clang -E' LD=ld.lld AR=aarch64-linux-gnu-ar NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=aarch64-linux-gnu-objdump STRIP=aarch64-linux-gnu-strip HOSTCC=clang OHOS_SOURCE_ROOT="$OHOS_ROOT" -j2 drivers/hdf/khdf/
          echo "PASS: OpenHarmony 6.1 LTS KHDF core and A32 HCS built successfully."

      - name: Link the complete ARM64 kernel with KHDF enabled
        env:
          PRODUCT_PATH: vendor/samsung/a32
        run: |
          make SHELL=/bin/bash CONFIG_SHELL=/bin/bash ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang CPP='clang -E' LD=ld.lld AR=aarch64-linux-gnu-ar NM=aarch64-linux-gnu-nm OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=aarch64-linux-gnu-objdump STRIP=aarch64-linux-gnu-strip HOSTCC=clang OHOS_SOURCE_ROOT="$OHOS_ROOT" -j2 Image dtbs
          test -s arch/arm64/boot/Image
          echo "PASS: complete ARM64 Image and device trees built with KHDF enabled."
